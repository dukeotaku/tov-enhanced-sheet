name: Build Foundry Module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build module ZIP
        run: |
          zip -r tov-enhanced-sheet.zip module.json styles

      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tov-enhanced-sheet
          path: tov-enhanced-sheet.zip
